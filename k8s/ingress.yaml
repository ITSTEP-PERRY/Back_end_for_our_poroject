apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: perry-ingress
  namespace: perry
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: perry-api
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: perry-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: perry-web
                port:
                  number: 8080
