
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Local Perry Product API
    location ^~ /api/ {
        proxy_pass http://perry-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://perry-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth service is not configured in this local environment.
    location ^~ /auth-api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Authentication service is not configured"}';
    }

    # User administration service is not configured.
    location ^~ /users-api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"User administration service is not configured"}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
