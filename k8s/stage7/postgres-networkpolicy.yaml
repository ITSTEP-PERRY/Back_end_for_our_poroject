apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-api
  namespace: perry-stage7
spec:
  podSelector:
    matchLabels:
      app: perry-postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: perry-api
        - podSelector:
            matchLabels:
              app: perry-db-maintenance

      ports:
        - protocol: TCP
          port: 5432
