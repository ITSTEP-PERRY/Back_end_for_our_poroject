apiVersion: apps/v1
kind: Deployment
metadata:
  name: perry-api
  namespace: perry-stage7
  labels:
    app: perry-api
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: perry-api

  template:
    metadata:
      labels:
        app: perry-api

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: perry-api
          image: back_end_for_our_poroject-api:security-v4
          imagePullPolicy: Never

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production

            - name: ASPNETCORE_URLS
              value: "http://+:8080"

            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: perry-api-db-credentials
                  key: ConnectionStrings__DefaultConnection

            - name: Jwt__SigningSecret
              valueFrom:
                secretKeyRef:
                  name: perry-api-jwt
                  key: Jwt__SigningSecret

            - name: Jwt__SkipSignatureValidation
              value: "false"

            - name: Smtp__UseStub
              value: "true"

            - name: DataProtection__KeysPath
              value: "/home/app/.aspnet/DataProtection-Keys"

            - name: DataProtection__CertificatePath
              value: "/etc/perry/dp-cert/certificate.pfx"

            - name: DataProtection__CertificatePassword
              valueFrom:
                secretKeyRef:
                  name: perry-api-dp-certificate
                  key: password

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

          volumeMounts:
            - name: uploads
              mountPath: /app/wwwroot/uploads

            - name: dpkeys
              mountPath: /home/app/.aspnet/DataProtection-Keys

            - name: dp-cert
              mountPath: /etc/perry/dp-cert
              readOnly: true

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: perry-api-uploads

        - name: dpkeys
          persistentVolumeClaim:
            claimName: perry-api-dpkeys

        - name: dp-cert
          secret:
            secretName: perry-api-dp-certificate
            defaultMode: 288
            items:
              - key: certificate.pfx
                path: certificate.pfx
