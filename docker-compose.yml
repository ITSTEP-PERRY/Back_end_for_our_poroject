# Perry — локальный стек
# PostgreSQL + Perry.Api
# Desktop/Mobile UI: папки frontend/ и mobile/ (Vite / Expo), не в compose
#
# cp .env.example .env
# docker compose up --build
#
# Defaults ниже — только для CI / быстрого локального старта.
# В проде задайте POSTGRES_PASSWORD и JWT_KEY через .env / secrets.

services:
  api:
    build:
      context: .
      dockerfile: src/Perry.Api/Dockerfile
    container_name: perry-api
    restart: 'unless-stopped'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "${ConnectionString}"
      Jwt__Key: ${JWT_KEY:-changeme-dev-jwt-signing-key-32chars}
      Jwt__SigningSecret: ${JWT_KEY:-changeme-dev-jwt-signing-key-32chars}
      Jwt__Issuer: ${JWT_ISSUER:-Perry.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-Perry.Client}
      Jwt__SkipSignatureValidation: ${JWT_SKIP_SIGNATURE:-false}
      Jwt__MapInboundClaims: "false"
      Jwt__RoleClaimType: role
      Jwt__NameClaimType: sub
      AuthService__BaseUrl: ${AUTH_SERVICE_BASE_URL:-https://perry-auth-service.orangeplant-910928aa.swedencentral.azurecontainerapps.io}
      AuthService__ServiceName: ${AUTH_SERVICE_NAME:-local-service}
      Smtp__UseStub: ${SMTP_USE_STUB:-true}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__EnableSsl: "true"
    ports:
      - "5272:8080"
      
  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

networks:
  default:
    external:
      name: api
volumes:
  perry_pg_data:
