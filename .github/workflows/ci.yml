name: Perry Product API CI

on:
  workflow_call: 
  push:
    branches:
      - deploy
    tags:
      - "v*"

jobs:
  publish-images:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_LOGIN }}

      - name: Set Docker image version tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Perry.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/itstep-perry/perry-api:latest
            ghcr.io/itstep-perry/perry-api:${{ github.sha }}
            ${{ steps.version.outputs.tag != '' && format('ghcr.io/itstep-perry/perry-api:{0}', steps.version.outputs.tag) || '' }}

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          # Scan working tree (not full git history): legacy .env was removed from tree
          # but still exists in old commits and would fail a historical scan forever.
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --redact --config /repo/.gitleaks.toml
