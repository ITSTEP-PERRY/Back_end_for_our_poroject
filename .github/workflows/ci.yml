name: Perry CI

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Compose defaults for CI (override locally via .env)
      POSTGRES_DB: perry
      POSTGRES_USER: perry
      POSTGRES_PASSWORD: changeme
      SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
      JWT_KEY: test-only-jwt-signing-key-for-ci-12345678901234567890

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Perry.sln

      - name: Build solution
        run: dotnet build Perry.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Perry.sln --configuration Release --no-build --verbosity normal

      # CI uses docker-compose.dev.yml (postgres+api). Root docker-compose.yml is custom-server (#D01).
      - name: Validate Docker Compose (dev + deploy)
        run: |
          docker compose -f docker-compose.dev.yml config > /dev/null
          ConnectionString="Host=localhost;Database=perry;Username=perry;Password=changeme" \
            NETWORK_MODE=bridge \
            docker compose -f docker-compose.yml config > /dev/null

      - name: Build Docker images
        run: docker compose -f docker-compose.dev.yml build

      - name: Start Docker environment
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Check running containers
        run: docker compose -f docker-compose.dev.yml ps

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:5272/health" > /dev/null; then
              echo "API is available"
              exit 0
            fi

            echo "Waiting for API... attempt $i/30"
            sleep 5
          done

          echo "API did not become available"
          docker compose -f docker-compose.dev.yml logs
          exit 1

      - name: Integration test API and database
        run: |
          for i in {1..30}; do
            response=$(curl -fsS "http://localhost:5272/api/products?page=1&pageSize=1" 2>/dev/null) && {
              echo "API successfully returned data from database"
              echo "$response"

              echo "$response" | jq -e '.items != null and .total != null' > /dev/null && {
                echo "Integration test passed"
                exit 0
              }
            }

            echo "Waiting for API and database... attempt $i/30"
            sleep 5
          done

          echo "Integration test failed"
          docker compose -f docker-compose.dev.yml logs
          exit 1

      - name: Stop Docker environment
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  frontend-security:
    name: Frontend Security and Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Block High and Critical npm vulnerabilities
        run: npm audit --audit-level=high

      - name: Build React frontend
        run: npm run build

  publish-images:
    name: Publish Docker images to GHCR
    needs: [build-and-test, security-check, frontend-security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

       # 1. Install QEMU for ARM64 emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Initialize Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_LOGIN }}

      - name: Set Docker image version tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Perry.Api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/itstep-perry/perry-api:latest
            ghcr.io/itstep-perry/perry-api:${{ github.sha }}
            ${{ steps.version.outputs.tag != '' && format('ghcr.io/itstep-perry/perry-api:{0}', steps.version.outputs.tag) || '' }}

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10 for security audit
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Block High and Critical NuGet vulnerabilities
        run: |
          dotnet restore src/Perry.Api/Perry.Api.csproj \
            -p:NuGetAudit=true \
            -p:NuGetAuditMode=all \
            -p:NuGetAuditLevel=high \
            -warnaserror:NU1903,NU1904

      - name: Build API image for vulnerability report
        run: |
          docker build \
            -f ./src/Perry.Api/Dockerfile \
            -t perry-api:ci-security-scan \
            .

      - name: Report container vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'perry-api:ci-security-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Scan repository for secrets
        shell: bash
        run: |
          set -euo pipefail

          # Scan committed source files, excluding runner artifacts.
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT

          git archive HEAD | tar -xf - -C "$scan_dir"

          docker run --rm \
            --mount "type=bind,source=$scan_dir,target=/repo,readonly" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --redact --config /repo/.gitleaks.toml
