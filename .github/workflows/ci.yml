name: Perry CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      SA_PASSWORD: ${{ secrets.SA_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Perry.sln

      - name: Build solution
        run: dotnet build Perry.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Perry.sln --configuration Release --no-build --verbosity normal

      - name: Validate Docker Compose
        run: docker compose config > /dev/null

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker environment
        run: docker compose up -d

      - name: Check running containers
        run: docker compose ps

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5001/swagger/index.html > /dev/null; then
              echo "API is available"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 5
          done

          echo "API did not become available"
          docker compose logs
          exit 1

      - name: Stop Docker environment
        if: always()
        run: docker compose down

  publish-images:
    name: Publish Docker images to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Perry.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/itstep-perry/perry-api:latest
            ghcr.io/itstep-perry/perry-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Perry.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/itstep-perry/perry-web:latest
            ghcr.io/itstep-perry/perry-web:${{ github.sha }}
