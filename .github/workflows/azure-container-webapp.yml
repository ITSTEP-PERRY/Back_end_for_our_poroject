name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: perry-product-back
  AZURE_WEBAPP_PACKAGE_PATH: "./publish"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./Perry.sln

      - name: Build
        run: dotnet build ./src/Perry.Api/Perry.Api.csproj --configuration Debug --no-restore

      - name: Publish
        run: dotnet publish ./src/Perry.Api/Perry.Api.csproj --configuration Debug --no-build --output '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}'

      - name: Check Azure publish profile
        id: azure
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "has_profile=false" >> "$GITHUB_OUTPUT"
            echo "AZURE_PUBLISH_PROFILE is not set — skip Deployment (build OK)."
          else
            echo "has_profile=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deployment
        if: steps.azure.outputs.has_profile == 'true'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
